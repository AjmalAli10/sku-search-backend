version: "3.8"

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: sku-chroma-db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Your SKU service (if you want to run both together)
  sku-service:
    build: .
    container_name: sku-embedding-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHROMA_PATH=http://chroma:8000
      - CHROMA_COLLECTION_NAME=sku-embeddings
    depends_on:
      chroma:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
